[project]
name = "dca-sizing-signals"
version = "0.1.0"
description = "Independent, structurally-boundaried sizing suggesters for the graded DCA strategy"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# market_data_ingest.prices (Massive + Alpaca price source). Same pins as requirements.txt.
prices = ["requests==2.34.2", "duckdb==2.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dca_shared_interfaces*", "connector_signals*", "market_data_ingest*", "comovement_signals*",
           "overnight_futures*", "kalman_signals*", "factor_signals*", "inventory_signals*", "mc_research*"]

[tool.pytest.ini_options]
markers = [
    "contract: opt-in live test against the real Massive/Alpaca APIs (PRICE_CONTRACT=1 + keys)",
]
