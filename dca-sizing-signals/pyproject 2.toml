[project]
name = "dca-sizing-signals"
version = "0.1.0"
description = "Independent, structurally-boundaried sizing suggesters for the graded DCA strategy"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dca_shared_interfaces*", "connector_signals*", "market_data_ingest*"]
