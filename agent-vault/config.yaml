# loop-and-gate-foundation settings, vendored (see UPSTREAM.md), plus this repo's task thresholds.
# scripts/vault-path.sh reads the `vault:` line with grep, so extra keys below are safe.
# Keep exactly one line that starts with `vault:`.

# Relative on purpose: the resolver only honours an ABSOLUTE path here, and falls back to ./vault beside this
# file, which is what makes cloud, CI and laptop sessions agree without any machine-local state.
vault: ./vault

# --- all-stock-dca -------------------------------------------------------------------------------------------
# No numbers are copied here. The repo's own safeguards are the source of truth (paths are repo-root relative).
safeguards_doc: docs/safeguards.md
budgets_config: config/budgets.json

# --- capex-monitoring ----------------------------------------------------------------------------------------
# Carried over from the original brief, not from any repo document. Re-evaluate in Knowledge/threshold-review.md.
capex_delta_flag_pct: 15  # VERIFIED 2026-10-03 (baseline run, see Knowledge/threshold-review.md): flag a quarter-over-quarter capex change larger than this
capex_research_addition_usd_m: 500  # UNVERIFIED, REQUIRES SCALE-TIERING: flat $500M is scale-blind (trips every quarter on hyperscalers); flag a research-spend addition larger than this (USD millions)

# --- dl-trading-pipeline -------------------------------------------------------------------------------------
# Same status as above. Numbers produced before the pipeline's look-ahead fixes are not comparable.
backtest_sharpe_min: 1.2  # UNVERIFIED: minimum acceptable backtest Sharpe
# RETIRED 2026-10-03: the DLTP audit found no slippage model (returns are frictionless), so there is no baseline to
# compare live slippage against. Restore only once DLTP models execution costs (Knowledge/threshold-review.md).
# live_slippage_vs_model_bps: 50
