name: Refresh Generated Docs

# Keeps docs/module_graph.md (the live import graph) equal to the code on main. On every push to main that
# touches Python, packaging or the prompt mirror -- and weekly as a backstop -- it regenerates the file and,
# if it drifted, opens (or refreshes) ONE draft PR. Drafts only: this repo's rule is that an operator marks
# PRs ready.
#
# TRUST BOUNDARY -- there is deliberately no `workflow_dispatch` trigger, same rule as compute-schedule.yml:
# `push`/`schedule` run this file and check out main, never a dispatch-selected ref, and this job holds
# `contents: write` + `pull-requests: write`.
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'scripts/**.py'
      - 'all_stock_dca/**.py'
      - 'guardrails/**.py'
      - 'selfheal/**.py'
      - 'viz/**.py'
      - 'pyproject.toml'
      - 'claude/**'
  schedule:
    - cron: '30 6 * * 1'

# main's runs are the audit record and are never cancelled (scripts/workflow_policy.py convention).
concurrency:
  group: refresh-generated-docs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # `gh label create` writes repository labels, which GitHub scopes under the Issues permission.
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Regenerate module graph
        run: python -m scripts.generate_module_graph

      - name: Check for diff
        id: check_diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: File guard
        if: steps.check_diff.outputs.diff == 'true'
        run: |
          if git status --porcelain | awk '{print $2}' | grep -vx 'docs/module_graph.md'; then
            echo "Unexpected files changed by the generator, aborting."
            exit 1
          fi

      - name: Open or refresh draft PR
        if: steps.check_diff.outputs.diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          BRANCH="auto-refresh-module-graph"
          SHA="$(git rev-parse --short HEAD)"
          BODY="$(printf '## Refresh docs/module_graph.md\n\nRegenerated by `python -m scripts.generate_module_graph` from main at `%s`.\n\nThe file is derived from the code (import graph, line counts, importer counts); review the diff for new or removed module dependencies. Draft: mark ready to merge.\n' "$SHA")"

          git checkout -b "$BRANCH"
          git add docs/module_graph.md
          git commit -m "[Auto] Refresh docs/module_graph.md"
          # A fixed branch keeps a single open PR: the force-push refreshes it instead of stacking new ones.
          git push --force origin "$BRANCH"

          gh label create automation --description "Automated repository maintenance" --color ededed --force >/dev/null
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY"
          else
            gh pr create --draft --title "[Auto] Refresh docs/module_graph.md" --body "$BODY" \
              --label automation --head "$BRANCH"
          fi

      - name: Close stale refresh PR when main already matches
        if: steps.check_diff.outputs.diff == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING="$(gh pr list --head auto-refresh-module-graph --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr close "$EXISTING" --delete-branch \
              --comment "Closing: docs/module_graph.md on main already matches the code."
          fi
