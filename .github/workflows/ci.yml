name: CI

on:
  # Push CI runs on main only. `claude/**` branches used to trigger here too, so a
  # branch with an open PR ran the whole suite twice (push + pull_request) -- the
  # pull_request run below already covers every branch that targets main. Doc-only
  # pushes to main skip CI. paths-ignore is deliberately NOT applied to
  # pull_request: a skipped workflow leaves any required status check pending.
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Draft PRs do not run CI (2026-10-31): every agent PR opens as a draft and
  # pushes several times, which was 285 PR runs (~12k runner-minutes) in one week.
  # The jobs below skip while the PR is a draft; ready_for_review starts the
  # first real run. Check a draft locally with scripts/local_ci.sh --changed.
  # Skipped jobs report success, and main has no required status checks.
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  # 2026-10-31 Actions-spend cut (billing block): pushes to main no longer run the
  # 3.11 leg or untouched sibling projects, so a weekday scheduled run is the
  # catch-all that still exercises everything on main once a day (3.11 + 3.12,
  # every sibling, the research audit). self-heal reacts to its failures exactly as
  # it does to a push run's -- both are CI runs whose head_branch is main.
  # workflow_dispatch gives the same full run on demand. The day-to-day gate is now
  # scripts/local_ci.sh (docs/local_ci.md).
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      runner:
        # Lets one manual run target the self-hosted runners (or any label) without
        # flipping the repo-wide CI_RUNS_ON variable for every other run.
        description: "runs-on label for this run only (blank = CI_RUNS_ON, else ubuntu-26.04)"
        required: false
        default: ""

# A rapid series of pushes to the same branch should leave one running build,
# not N. Never cancel on main -- those runs are the record of what landed.
# cancel-in-progress: false is not enough on its own: GitHub still drops an older
# run that is merely PENDING in a group when a newer one queues, which left merges
# such as #1901 with a cancelled run, no jobs, and no 3.11 record. So every push to
# main gets its own group (keyed by commit) and runs; other refs keep one group per
# ref so a PR's older runs are still cancelled by its newer pushes.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runner: every job reads `runs-on` from the CI_RUNS_ON repository variable and
# falls back to GitHub-hosted ubuntu-26.04 when it is unset. Set it to the label of
# a self-hosted runner (e.g. `gh variable set CI_RUNS_ON --body self-hosted`) to run
# this whole workflow off GitHub-hosted runner minutes (check GitHub's current
# self-hosted pricing first); delete the variable to switch back. See
# docs/local_ci.md for the runner setup, the pricing note and its security caveats.
# A workflow_dispatch run can override the label for that run alone (`gh workflow run CI
# -f runner=self-hosted`). On self-hosted runners every job sets up Python through
# .github/actions/setup-python (a uv-managed venv), because actions/setup-python's macOS
# builds need sudo.

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  # Decides which sibling-project jobs (and whether the research audit) a run
  # needs. Each sibling is an isolated tree with its own deps, so a change
  # elsewhere cannot break it. PRs diff against their base; pushes to main diff
  # the pushed range (before..after) -- until 2026-10-31 pushes ran everything,
  # which made main's ~76 pushes a week ~60% of all Actions minutes. The scheduled
  # and manual runs still run everything, as does any change to the shared dev
  # pins or this workflow, or a push whose range cannot be listed.
  changes:
    name: Detect changed projects
    # Skipped on drafts, which also skips every sibling job (they `need` this one).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      production-safe-agent-loop: ${{ steps.diff.outputs.production-safe-agent-loop }}
      ticker-advisor: ${{ steps.diff.outputs.ticker-advisor }}
      ml-forecaster: ${{ steps.diff.outputs.ml-forecaster }}
      wondrous-octopus: ${{ steps.diff.outputs.wondrous-octopus }}
      ticker-market-breadth: ${{ steps.diff.outputs.ticker-market-breadth }}
      llm-providers: ${{ steps.diff.outputs.llm-providers }}
      yfinance-prefetch: ${{ steps.diff.outputs.yfinance-prefetch }}
      dca-sizing-signals: ${{ steps.diff.outputs.dca-sizing-signals }}
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          projects="production-safe-agent-loop ticker-advisor ml-forecaster wondrous-octopus ticker-market-breadth llm-providers yfinance-prefetch dca-sizing-signals"
          all=false
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # The compare API lists at most 300 files; at that size (or on any
            # error) fail open to running everything rather than skip a sibling.
            if ! files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename'); then
              all=true
            elif [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ]; then
              all=true
            fi
          else
            all=true
          fi
          # Shared inputs every sibling job installs from.
          if echo "$files" | grep -Eq '^(requirements-dev\.txt|\.github/workflows/ci\.yml)$'; then
            all=true
          fi
          # The research audit only has something new to say when a dependency
          # manifest moved (a new advisory against unchanged pins is caught by the
          # scheduled run, which always audits).
          if [ "$all" = true ] || echo "$files" | grep -Eq '(^|/)requirements[^/]*\.txt$|^uv\.lock$|^pyproject\.toml$'; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"
          fi
          for p in $projects; do
            if [ "$all" = true ] || echo "$files" | grep -q "^$p/"; then
              echo "$p=true" >> "$GITHUB_OUTPUT"
            else
              echo "$p=false" >> "$GITHUB_OUTPUT"
            fi
          done

  test:
    name: Lint & test (core DCA)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    # The suite (~12k tests) now takes ~13-15 minutes on a cold runner; the old
    # 15-minute ceiling cancelled the 3.12 leg after its tests had passed
    # on PR 1712. Still a ceiling that stops a hung job from burning the
    # full 6-hour runner default.
    # 2026-11-04: raised 30 -> 45. After PR 2152 restored ~19k reverted lines the
    # 3.12 leg took 29m19s on main (ec07c5c) and 25m on PR 2151's rerun, and
    # PR 2151's first attempt was cancelled at 30m at 95% with no failures.
    # Still a hang ceiling. PR-reachable timeouts now sum to 150, which is
    # config/self_heal.json's ci_worst_case_minutes; raise that with this.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # PRs and pushes to main run 3.12 only; the 3.11 leg runs on the
        # weekday scheduled run and workflow_dispatch. Until 2026-10-31 every
        # push to main ran both (~20 min each); scripts/local_ci.sh --py311 runs
        # the 3.11 leg locally.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.11", "3.12"]' || '["3.12"]') }}
    steps:
      # NOTE: actions are pinned to full commit SHAs (a tag is mutable), with the
      # version in a trailing comment; the dependabot config in this directory
      # moves the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint (core modules)
        run: ruff check .

      # ADVISORY, NOT A GATE (CLAUDE.md: Pyright is not a CI gate while its repo-wide diagnostics remain
      # unresolved). `continue-on-error` means a finding here never turns the build red. It type-checks only
      # the money-path modules, which measured 0 errors when this step was added (2026-11-13), so a new
      # diagnostic in one of them is visible in the log the day it lands. To make it a gate, delete
      # `continue-on-error` after the repo owner agrees; grow the file list as other modules are cleaned up.
      # One Python leg is enough: type errors do not differ between 3.11 and 3.12 here.
      - name: Pyright (advisory, money-path modules)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: >-
          pyright
          dca_risk.py dca_live_adapters.py dca_runner.py run_dca.py
          dca_alerts.py dca_fileio.py dca_config.py dca_paths.py
          scripts/backup_state_root.py

      # --cov-fail-under guards the live decision path against silent erosion.
      # The threshold is set just under the current figure so a genuine drop
      # fails the build without flapping on a one-line change.
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=90

      - name: Smoke-test orchestrator (dry-run demo)
        # scheduled_runs/ keeps the demo's same-day artifact scan inside $RUNNER_TEMP/dca-demo (see tests/test_demo_artifacts_dir.py).
        run: python run_dca.py --demo --report --now 2026-07-06T15:45 --artifacts-dir "$RUNNER_TEMP/dca-demo/scheduled_runs/demo"

  audit:
    name: Dependency & secret audit
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned audit tooling
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt

      - name: Audit pinned dev dependencies
        run: pip-audit --requirement requirements-dev.txt --strict

      # Secret scanning is NOT a step here on purpose. The specific leak this
      # repo actually had -- the brokerage account number in config/, docs/, and
      # schemas/ -- is now blocked by test_config_invariants.py, which runs in
      # the test job above and fails on any account-shaped literal.
      #
      # For the general class (tokens, keys, webhook URLs), enable GitHub's
      # native secret scanning and push protection in
      # Settings -> Code security. That scans history as well as new pushes,
      # needs no third-party action in the pipeline, and rejects the commit at
      # push time rather than after it has already landed.

  # Keep this outside the core audit job: self-heal only reproduces the
  # core lint/test/dev-audit surface and must not claim to repair research.
  research-audit:
    name: Dependency audit (research)
    needs: changes
    # Skipped on drafts too: `changes` is, and a job whose need is skipped skips.
    if: needs.changes.outputs.deps == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned audit tooling
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt

      # Export the committed graph, then resolve each independent install
      # manifest without building or installing its heavy ML dependencies.
      # pip-audit reads the exact transitive versions from these temporary
      # PEP 751 locks; it does not directly read uv.lock.
      # Manifests resolve for this runner's exact interpreter (e.g. 3.11.14), not the bare
      # matrix value: uv reads "3.11" as 3.11.0, and on 2026-11-13 that picked soupsieve 2.10
      # (GHSA-mmhr-3c5m-f64f, fixed only in 4.x, which needs Python >= 3.11.5) for every manifest
      # that pulls in beautifulsoup4, although no CI job installs on a 3.11.0 interpreter.
      # Operator decision (PR #2252): audit what CI's interpreter actually installs.
      - name: Audit runtime and research dependency trees
        run: |
          audit_dir="$RUNNER_TEMP/dca-dependency-audit"
          mkdir -p "$audit_dir"
          pyver="$(python -c 'import platform; print(platform.python_version())')"
          echo "Resolving manifests for Python $pyver"
          # The bare matrix value no longer pins the minor version, so prove the interpreter is
          # the one this leg names: a self-hosted runner (CI_RUNS_ON) whose PATH python is some
          # other minor would otherwise audit the wrong tree and still go green (PR #2259 review).
          case "$pyver" in
            "${{ matrix.python-version }}".*) ;;
            *) echo "::error::research audit leg ${{ matrix.python-version }} resolved Python $pyver"; exit 1 ;;
          esac
          uv export --locked --all-extras --no-emit-project --format pylock.toml --output-file "$audit_dir/pylock.root.toml"
          for manifest in \
            production-safe-agent-loop/requirements.txt \
            ticker-advisor/requirements.txt \
            ml-forecaster/requirements.txt \
            wondrous-octopus/requirements.txt \
            ticker-market-breadth/requirements.txt \
            llm-providers/requirements.txt \
            yfinance-prefetch/requirements.txt \
            dca-sizing-signals/requirements.txt \
            trading-strategies/requirements.txt \
            analysis/market-graph-3d/requirements.txt; do
            scope="${manifest%/requirements.txt}"
            uv pip compile "$manifest" --python-version "$pyver" --no-build --format pylock.toml --output-file "$audit_dir/pylock.${scope//\//-}.toml"
          done
          pip-audit --locked "$audit_dir" --strict

  production-safe-agent-loop:
    name: Lint & test (production-safe-agent-loop)
    needs: changes
    if: needs.changes.outputs.production-safe-agent-loop == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r production-safe-agent-loop/requirements.txt

      - name: Ruff lint
        # This subproject is excluded from the root pyproject.toml's ruff
        # scope (own deps/conventions, see pyproject.toml's extend-exclude
        # comment), so lint it standalone with the same rule set instead of
        # relying on root config discovery. --isolated avoids the root
        # config's exclude silently turning this into a no-op; "I" (import
        # sorting) is dropped because ruff can't infer local-package imports
        # like `spec_writer` as first-party without a project config here,
        # which makes it flag correctly-grouped imports as unsorted.
        run: ruff check --isolated --select=E,F,B --line-length=120 production-safe-agent-loop

      - name: Run tests
        working-directory: production-safe-agent-loop
        run: python -m pytest tests/

  ticker-advisor:
    name: Lint & test (ticker-advisor)
    needs: changes
    if: needs.changes.outputs.ticker-advisor == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      # Deliberately NOT `pip install -r ticker-advisor/requirements.txt` here:
      # that pulls in vectorbt and a multi-GB torch/transformers install for
      # every CI run. Install only the lightweight signals (health metrics,
      # RSI/MA-crossover signal generation, scoring, report, pricing) --
      # the vectorbt-backed backtest and the real FinBERT model load are
      # importorskip-guarded in tests/, so they skip cleanly here rather
      # than failing, and still run wherever the full requirements.txt is
      # installed (a contributor's machine, a manual full-dep CI dispatch).
      # pandas_market_calendars (used by advise_tickers.py's benchmark-
      # calendar-gap detection) is included here, unlike vectorbt/torch --
      # it's a pure-Python calendar lookup with no heavy binary/GPU deps,
      # so there's no install-time cost to justify importorskip-guarding it
      # the same way.
      - name: Install lightweight tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pandas numpy scipy requests pandas_market_calendars

      - name: Ruff lint
        # Same rationale as production-safe-agent-loop's step above: this
        # subproject is excluded from the root pyproject.toml's ruff scope.
        run: ruff check --isolated --select=E,F,B --line-length=120 ticker-advisor

      - name: Run tests (lightweight subset; heavy-dep tests skip)
        working-directory: ticker-advisor
        run: python -m pytest tests/

  ml-forecaster:
    name: Lint & test (ml-forecaster)
    needs: changes
    if: needs.changes.outputs.ml-forecaster == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      # Unlike ticker-advisor's requirements.txt, this one has no vectorbt/
      # torch/transformers -- pandas/numpy/scikit-learn/scipy install quickly,
      # so the full requirements.txt is used directly rather than a
      # hand-picked lightweight subset.
      - name: Install dependencies
        # jsonschema (needed for this job's schema-validation tests) comes
        # from requirements-dev.txt's own pin (jsonschema==4.26.0) -- a
        # separate, unpinned `pip install jsonschema` here would be a no-op
        # today (pip doesn't reinstall/upgrade an already-satisfied,
        # unversioned request), but is a landmine: it silently defeats the
        # pin's protection the moment that pin is ever removed or loosened,
        # contradicting CLAUDE.md's "Dev tool versions are pinned ...
        # bump deliberately" (Antigravity review: "Unpinned Dependency
        # Re-installation in CI Workflow").
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r ml-forecaster/requirements.txt

      - name: Ruff lint
        # Excluded from the root pyproject.toml's ruff scope, same reasoning
        # as production-safe-agent-loop/ and ticker-advisor/ above.
        run: ruff check --isolated --select=E,F,B --line-length=120 ml-forecaster

      - name: Run tests
        working-directory: ml-forecaster
        run: python -m pytest tests/

  wondrous-octopus:
    name: Lint & test (wondrous-octopus)
    needs: changes
    if: needs.changes.outputs.wondrous-octopus == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    # 20 (not the sibling-standard 10): the CPU torch wheel adds ~200 MB of
    # download plus the transformer tests' training time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
          # Cache the ~200 MB CPU torch wheel between runs (the other
          # sibling jobs' installs are small enough not to bother).
          cache: "pip"
          cache-dependency-path: wondrous-octopus/requirements.txt

      # The INVERSE of ticker-advisor's install choice (its comment above):
      # there FinBERT/torch is peripheral, so CI skips the multi-GB pull and
      # lets those tests importorskip away. Here the torch model IS the
      # subproject's centerpiece -- a CI run that never executes it provides
      # no signal -- so CI installs the CPU-only wheel from PyTorch's own
      # index (~200 MB, an order of magnitude smaller than the default CUDA
      # bundle). The importorskip guards STAY in tests/, so removing the
      # torch line later degrades the torch tests to skips, never failures.
      # Order matters: the CPU torch wheel installs FIRST, so the
      # requirements.txt line's unpinned `torch` is already satisfied and
      # pip never reaches for the multi-GB default CUDA bundle. Installing
      # the subproject's own requirements file (rather than a hand-picked
      # list) keeps CI aligned with the local-dev instructions in CLAUDE.md
      # (Antigravity review: "Dependencies mismatch in CI job").
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r wondrous-octopus/requirements.txt

      - name: Ruff lint
        # Excluded from the root pyproject.toml's ruff scope, same reasoning
        # as the other sibling subprojects above.
        run: ruff check --isolated --select=E,F,B --line-length=120 wondrous-octopus

      - name: Run tests
        working-directory: wondrous-octopus
        run: python -m pytest tests/

  ticker-market-breadth:
    name: Lint & test (ticker-market-breadth)
    needs: changes
    if: needs.changes.outputs.ticker-market-breadth == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ticker-market-breadth/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r ticker-market-breadth/requirements.txt

      - name: Ruff lint
        run: ruff check --isolated --select=E,F,B --line-length=120 ticker-market-breadth

      - name: Run tests
        working-directory: ticker-market-breadth
        run: python -m pytest tests/

  llm-providers:
    name: Lint & test (llm-providers)
    needs: changes
    if: needs.changes.outputs.llm-providers == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            llm-providers/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r llm-providers/requirements.txt

      - name: Ruff lint
        run: ruff check --isolated --select=E,F,B --line-length=120 llm-providers

      - name: Run tests
        working-directory: llm-providers
        run: python -m pytest tests/

  yfinance-prefetch:
    name: Lint & test (yfinance-prefetch)
    needs: changes
    if: needs.changes.outputs.yfinance-prefetch == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            yfinance-prefetch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r yfinance-prefetch/requirements.txt

      - name: Ruff lint
        run: ruff check --isolated --select=E,F,B --line-length=120 yfinance-prefetch

      - name: Run tests
        working-directory: yfinance-prefetch
        run: python -m pytest tests/

  dca-sizing-signals:
    name: Lint & test (dca-sizing-signals)
    needs: changes
    # Until 2026-11-12 no job ran this suite (the root addopts --ignore it), so
    # tests/test_architecture_boundaries.py -- suggester packages never import each other
    # or near_close_dca -- was only ever checked by hand. 3.12 only, path-filtered, per
    # the 2026-10-31 Actions-spend cut (docs/local_ci.md).
    if: needs.changes.outputs.dca-sizing-signals == 'true'
    runs-on: ${{ inputs.runner || vars.CI_RUNS_ON || 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            dca-sizing-signals/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r dca-sizing-signals/requirements.txt

      - name: Ruff lint
        run: ruff check --isolated --select=E,F,B --line-length=120 dca-sizing-signals

      - name: Run tests
        working-directory: dca-sizing-signals
