name: CI

on:
  # Push CI runs on main only. `claude/**` branches used to trigger here too, so a
  # branch with an open PR ran the whole suite twice (push + pull_request) -- the
  # pull_request run below already covers every branch that targets main. Doc-only
  # pushes to main skip CI. paths-ignore is deliberately NOT applied to
  # pull_request: a skipped workflow leaves any required status check pending.
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: ["main"]

# A rapid series of pushes to the same branch should leave one running build,
# not N. Never cancel on main -- those runs are the record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  # Decides which sibling-project jobs a PR needs. Each sibling is an isolated
  # tree with its own deps, so a change elsewhere cannot break it. Pushes to main
  # always run everything (that run is the record of what landed, and self-heal
  # reacts to it), as does any change to the shared dev pins or this workflow.
  changes:
    name: Detect changed projects
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      production-safe-agent-loop: ${{ steps.diff.outputs.production-safe-agent-loop }}
      ticker-advisor: ${{ steps.diff.outputs.ticker-advisor }}
      ml-forecaster: ${{ steps.diff.outputs.ml-forecaster }}
      wondrous-octopus: ${{ steps.diff.outputs.wondrous-octopus }}
      ticker-market-breadth: ${{ steps.diff.outputs.ticker-market-breadth }}
      llm-providers: ${{ steps.diff.outputs.llm-providers }}
      yfinance-prefetch: ${{ steps.diff.outputs.yfinance-prefetch }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          projects="production-safe-agent-loop ticker-advisor ml-forecaster wondrous-octopus ticker-market-breadth llm-providers yfinance-prefetch"
          all=false
          files=""
          if [ "$EVENT" != "pull_request" ]; then
            all=true
          else
            files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
            # Shared inputs every sibling job installs from.
            if echo "$files" | grep -Eq '^(requirements-dev\.txt|\.github/workflows/ci\.yml)$'; then
              all=true
            fi
          fi
          for p in $projects; do
            if [ "$all" = true ] || echo "$files" | grep -q "^$p/"; then
              echo "$p=true" >> "$GITHUB_OUTPUT"
            else
              echo "$p=false" >> "$GITHUB_OUTPUT"
            fi
          done

  test:
    name: Lint & test (core DCA)
    runs-on: ubuntu-26.04
    # The suite (~12k tests) now takes ~13-15 minutes on a cold runner; the old
    # 15-minute ceiling cancelled the 3.12 leg after its tests had passed
    # on PR 1712. Still a ceiling that stops a hung job from burning the
    # full 6-hour runner default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PRs run 3.12 only; main (the post-merge record, and what self-heal
        # reacts to) keeps both interpreters. Halves PR minutes.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11", "3.12"]') }}
    steps:
      # NOTE: actions are pinned by tag, not commit SHA. Tags are mutable, so
      # SHA pinning is the stronger posture; the dependabot config in this
      # directory keeps these current in the meantime.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint (core modules)
        run: ruff check .

      # --cov-fail-under guards the live decision path against silent erosion.
      # The threshold is set just under the current figure so a genuine drop
      # fails the build without flapping on a one-line change.
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=90

      - name: Smoke-test orchestrator (dry-run demo)
        run: python run_dca.py --demo --report --now 2026-07-06T15:45 --artifacts-dir "$RUNNER_TEMP/dca-demo"

  audit:
    name: Dependency & secret audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned audit tooling
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt

      - name: Audit pinned dev dependencies
        run: pip-audit --requirement requirements-dev.txt --strict

      # Secret scanning is NOT a step here on purpose. The specific leak this
      # repo actually had -- the brokerage account number in config/, docs/, and
      # schemas/ -- is now blocked by test_config_invariants.py, which runs in
      # the test job above and fails on any account-shaped literal.
      #
      # For the general class (tokens, keys, webhook URLs), enable GitHub's
      # native secret scanning and push protection in
      # Settings -> Code security. That scans history as well as new pushes,
      # needs no third-party action in the pipeline, and rejects the commit at
      # push time rather than after it has already landed.

  # Keep this outside the core audit job: self-heal only reproduces the
  # core lint/test/dev-audit surface and must not claim to repair research.
  research-audit:
    name: Dependency audit (research)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned audit tooling
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt

      # Export the committed graph, then resolve each independent install
      # manifest without building or installing its heavy ML dependencies.
      # pip-audit reads the exact transitive versions from these temporary
      # PEP 751 locks; it does not directly read uv.lock.
      - name: Audit runtime and research dependency trees
        run: |
          audit_dir="$RUNNER_TEMP/dca-dependency-audit"
          mkdir -p "$audit_dir"
          uv export --locked --all-extras --no-emit-project --format pylock.toml --output-file "$audit_dir/pylock.root.toml"
          for manifest in \
            production-safe-agent-loop/requirements.txt \
            ticker-advisor/requirements.txt \
            ml-forecaster/requirements.txt \
            wondrous-octopus/requirements.txt \
            ticker-market-breadth/requirements.txt \
            llm-providers/requirements.txt \
            yfinance-prefetch/requirements.txt \
            trading-strategies/requirements.txt \
            analysis/market-graph-3d/requirements.txt; do
            scope="${manifest%/requirements.txt}"
            uv pip compile "$manifest" --python-version "${{ matrix.python-version }}" --no-build --format pylock.toml --output-file "$audit_dir/pylock.${scope//\//-}.toml"
          done
          pip-audit --locked "$audit_dir" --strict

  production-safe-agent-loop:
    name: Lint & test (production-safe-agent-loop)
    needs: changes
    if: needs.changes.outputs.production-safe-agent-loop == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r production-safe-agent-loop/requirements.txt

      - name: Ruff lint
        # This subproject is excluded from the root pyproject.toml's ruff
        # scope (own deps/conventions, see pyproject.toml's extend-exclude
        # comment), so lint it standalone with the same rule set instead of
        # relying on root config discovery. --isolated avoids the root
        # config's exclude silently turning this into a no-op; "I" (import
        # sorting) is dropped because ruff can't infer local-package imports
        # like `spec_writer` as first-party without a project config here,
        # which makes it flag correctly-grouped imports as unsorted.
        run: ruff check --isolated --select=E,F,B --line-length=120 production-safe-agent-loop

      - name: Run tests
        working-directory: production-safe-agent-loop
        run: python -m pytest tests/

  ticker-advisor:
    name: Lint & test (ticker-advisor)
    needs: changes
    if: needs.changes.outputs.ticker-advisor == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Deliberately NOT `pip install -r ticker-advisor/requirements.txt` here:
      # that pulls in vectorbt and a multi-GB torch/transformers install for
      # every CI run. Install only the lightweight signals (health metrics,
      # RSI/MA-crossover signal generation, scoring, report, pricing) --
      # the vectorbt-backed backtest and the real FinBERT model load are
      # importorskip-guarded in tests/, so they skip cleanly here rather
      # than failing, and still run wherever the full requirements.txt is
      # installed (a contributor's machine, a manual full-dep CI dispatch).
      # pandas_market_calendars (used by advise_tickers.py's benchmark-
      # calendar-gap detection) is included here, unlike vectorbt/torch --
      # it's a pure-Python calendar lookup with no heavy binary/GPU deps,
      # so there's no install-time cost to justify importorskip-guarding it
      # the same way.
      - name: Install lightweight tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pandas numpy scipy requests pandas_market_calendars

      - name: Ruff lint
        # Same rationale as production-safe-agent-loop's step above: this
        # subproject is excluded from the root pyproject.toml's ruff scope.
        run: ruff check --isolated --select=E,F,B --line-length=120 ticker-advisor

      - name: Run tests (lightweight subset; heavy-dep tests skip)
        working-directory: ticker-advisor
        run: python -m pytest tests/

  ml-forecaster:
    name: Lint & test (ml-forecaster)
    needs: changes
    if: needs.changes.outputs.ml-forecaster == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Unlike ticker-advisor's requirements.txt, this one has no vectorbt/
      # torch/transformers -- pandas/numpy/scikit-learn/scipy install quickly,
      # so the full requirements.txt is used directly rather than a
      # hand-picked lightweight subset.
      - name: Install dependencies
        # jsonschema (needed for this job's schema-validation tests) comes
        # from requirements-dev.txt's own pin (jsonschema==4.26.0) -- a
        # separate, unpinned `pip install jsonschema` here would be a no-op
        # today (pip doesn't reinstall/upgrade an already-satisfied,
        # unversioned request), but is a landmine: it silently defeats the
        # pin's protection the moment that pin is ever removed or loosened,
        # contradicting CLAUDE.md's "Dev tool versions are pinned ...
        # bump deliberately" (Antigravity review: "Unpinned Dependency
        # Re-installation in CI Workflow").
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r ml-forecaster/requirements.txt

      - name: Ruff lint
        # Excluded from the root pyproject.toml's ruff scope, same reasoning
        # as production-safe-agent-loop/ and ticker-advisor/ above.
        run: ruff check --isolated --select=E,F,B --line-length=120 ml-forecaster

      - name: Run tests
        working-directory: ml-forecaster
        run: python -m pytest tests/

  wondrous-octopus:
    name: Lint & test (wondrous-octopus)
    needs: changes
    if: needs.changes.outputs.wondrous-octopus == 'true'
    runs-on: ubuntu-26.04
    # 20 (not the sibling-standard 10): the CPU torch wheel adds ~200 MB of
    # download plus the transformer tests' training time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # Cache the ~200 MB CPU torch wheel between runs (the other
          # sibling jobs' installs are small enough not to bother).
          cache: "pip"
          cache-dependency-path: wondrous-octopus/requirements.txt

      # The INVERSE of ticker-advisor's install choice (its comment above):
      # there FinBERT/torch is peripheral, so CI skips the multi-GB pull and
      # lets those tests importorskip away. Here the torch model IS the
      # subproject's centerpiece -- a CI run that never executes it provides
      # no signal -- so CI installs the CPU-only wheel from PyTorch's own
      # index (~200 MB, an order of magnitude smaller than the default CUDA
      # bundle). The importorskip guards STAY in tests/, so removing the
      # torch line later degrades the torch tests to skips, never failures.
      # Order matters: the CPU torch wheel installs FIRST, so the
      # requirements.txt line's unpinned `torch` is already satisfied and
      # pip never reaches for the multi-GB default CUDA bundle. Installing
      # the subproject's own requirements file (rather than a hand-picked
      # list) keeps CI aligned with the local-dev instructions in CLAUDE.md
      # (Antigravity review: "Dependencies mismatch in CI job").
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r wondrous-octopus/requirements.txt

      - name: Ruff lint
        # Excluded from the root pyproject.toml's ruff scope, same reasoning
        # as the other sibling subprojects above.
        run: ruff check --isolated --select=E,F,B --line-length=120 wondrous-octopus

      - name: Run tests
        working-directory: wondrous-octopus
        run: python -m pytest tests/

  ticker-market-breadth:
    name: Lint & test (ticker-market-breadth)
    needs: changes
    if: needs.changes.outputs.ticker-market-breadth == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ticker-market-breadth/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r ticker-market-breadth/requirements.txt

      - name: Ruff lint
        run: ruff check --isolated --select=E,F,B --line-length=120 ticker-market-breadth

      - name: Run tests
        working-directory: ticker-market-breadth
        run: python -m pytest tests/

  llm-providers:
    name: Lint & test (llm-providers)
    needs: changes
    if: needs.changes.outputs.llm-providers == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            llm-providers/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r llm-providers/requirements.txt

      - name: Ruff lint
        run: ruff check --isolated --select=E,F,B --line-length=120 llm-providers

      - name: Run tests
        working-directory: llm-providers
        run: python -m pytest tests/

  yfinance-prefetch:
    name: Lint & test (yfinance-prefetch)
    needs: changes
    if: needs.changes.outputs.yfinance-prefetch == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            yfinance-prefetch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r yfinance-prefetch/requirements.txt

      - name: Ruff lint
        run: ruff check --isolated --select=E,F,B --line-length=120 yfinance-prefetch

      - name: Run tests
        working-directory: yfinance-prefetch
        run: python -m pytest tests/
