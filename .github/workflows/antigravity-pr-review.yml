name: Antigravity PR Reviewer
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for existing review
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const header = 'Antigravity AI Code Review';
            const doneMarker = '<!-- antigravity-review:complete -->';
            const skipRe = /Automated AI review (was skipped|could not be generated)/;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            // "Already reviewed" means a real review is present: either our
            // completion marker, or (for reviews posted before the marker
            // existed) the review header on a comment that is NOT a skip note.
            const done = comments.some((c) => {
              const body = typeof c.body === 'string' ? c.body : '';
              if (body.includes(doneMarker)) return true;
              return body.includes(header) && !skipRe.test(body);
            });
            if (done) {
              core.info('A completed Antigravity review already exists on this PR; skipping.');
            }
            core.setOutput('reviewed', done ? 'true' : 'false');

      - name: Checkout Repository
        if: steps.check.outputs.reviewed != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for git diff

      - name: Set up Python
        if: steps.check.outputs.reviewed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Antigravity SDK
        if: steps.check.outputs.reviewed != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity

      - name: Generate PR Review
        id: run_review
        if: steps.check.outputs.reviewed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python .github/scripts/pr_review.py > review_output.md

      - name: Post PR Comment
        if: steps.check.outputs.reviewed != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewText = fs.readFileSync('review_output.md', 'utf8');
            if (!reviewText.trim()) {
              core.info('Empty review output; nothing to post.');
              return;
            }
            if (reviewText.includes('No changes found in PR diff')) {
              core.info('No diff to review; nothing to post.');
              return;
            }
            const doneMarker = '<!-- antigravity-review:complete -->';
            const skipMarker = '<!-- antigravity-review:skipped -->';
            const skipRe = /Automated AI review (was skipped|could not be generated)/;
            if (skipRe.test(reviewText)) {
              // Rate-limited or errored: do NOT block future runs (no completion
              // marker), so a later push can still land a real review. Post at
              // most one skip note to avoid spamming the PR.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              if (comments.some((c) => typeof c.body === 'string' && c.body.includes(skipMarker))) {
                core.info('Skip note already present; not re-posting.');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${skipMarker}\n## 🤖 Antigravity AI Code Review\n\n${reviewText}`,
              });
              return;
            }
            // A real review: tag it with the completion marker so every later
            // run on this PR sees it and skips.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${doneMarker}\n## 🤖 Antigravity AI Code Review\n\n${reviewText}`,
            });
