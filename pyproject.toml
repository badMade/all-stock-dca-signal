[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "all-stock-dca"
version = "0.1.0"
description = "Near-close graded dollar-cost-averaging strategy: signal logic, budgets, safeguards, reporting, and broker-agnostic adapters."
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# The core strategy, config loader, live adapters, reporting, and CLI are
# standard-library only — no runtime third-party dependencies. Optional extras
# (below) cover the separate trading-strategies research tools.
dependencies = []

[project.optional-dependencies]
# Test/lint tooling. Kept in sync with requirements-dev.txt, which pins exact
# versions for CI; this extra backs the documented `pip install -e '.[dev]'`
# path. Both must install the same tools or the two paths run different suites:
# without jsonschema/referencing the schema tests importorskip themselves into a
# silent pass, and without pytest-cov the documented coverage command cannot run
# at all (Codex review, PR #219).
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "jsonschema>=4.25",
    "referencing>=0.36",
    "pytest-cov>=7.0",
    # scripts/workflow_policy.py imports yaml; without it here, `pip install
    # -e '.[dev]'` collects fine on an environment where jsonschema/referencing
    # happen to pull PyYAML in transitively and fails collection everywhere
    # else, since it isn't a documented dependency of either (Codex review,
    # PR #219: "Include PyYAML in the dev extra").
    "pyyaml>=6.0",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
    "types-beautifulsoup4>=4.12",
]
# Heavy, undeclared-elsewhere deps used only by the trading-strategies/ research
# tools (backtester, sentiment monitor). Not needed to run the DCA strategy.
strategies = [
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "jinja2",
    "yfinance",
    "vectorbt",
    "alpaca-py",
    "transformers",
    "torch",
]

[project.scripts]
run-dca = "run_dca:main"
run-dca-risk = "dca_risk:main"

[tool.setuptools]
# Flat single-file modules rather than a package tree; list them explicitly.
py-modules = [
    "near_close_dca",
    "morning_dca",
    "midday_dca",
    "dca_alerts",
    # Shared outbound-network validation imported by dca_alerts; it must be
    # present for packaged entry points to import outside a source checkout.
    "dca_net_utils",
    "dca_config",
    "dca_fileio",
    # Imported by morning/midday/alerts and by scripts/*, so it must ship with
    # the wheel or those imports fail outside a checkout.
    "dca_paths",
    "dca_risk",
    "dca_live_adapters",
    "dca_reporting",
    "dca_cost_tracker",
    "dca_notion_sync",
    "dca_weekly_dashboard",
    "run_dca",
    # The seven-slot live-runner entrypoint (docs/live_wiring.md); omitting it
    # here means `import dca_runner` only works from a source checkout, not an
    # installed wheel (Codex review: "Ship the new runner in the installed
    # package").
    "dca_runner",
    # The market-open (9:35) and intraday (11:30/1:30/2:30) live-execution
    # stream executors, plus the cumulative sub-dollar credit ledger they
    # (and near_close_dca's final-session top-up guard) depend on. Omitting
    # these left the new executor and credit APIs importable only from a
    # source checkout, not an installed wheel (Codex review: "Ship all newly
    # added stream modules and configs").
    "market_open_dca",
    "intraday_dca",
    "dca_cumulative",
    # Imported by scripts/run_tickers_daily_update.py, scripts/run_ticker_maintenance.py,
    # and scripts/refresh_active_ticker_histories.py to resolve the ticker-history
    # directory; without it those jobs fail with ModuleNotFoundError outside a
    # source checkout.
    "dca_ticker_paths",
    # The durable intraday observation archive, imported unconditionally by
    # both morning_dca and near_close_dca. Without it, importing the
    # installed-wheel executors (or launching the packaged CLI) fails with
    # ModuleNotFoundError outside a source checkout (Codex review: "Package
    # the intraday archive module").
    "dca_intraday_archive",
    # The opt-in inverse-Martingale deferred-accumulation sizing mode. Imported
    # unconditionally by near_close_dca (_run_once_impl's injection site) and
    # by dca_config.load_inverse_martingale_config; without it here, both fail
    # with ModuleNotFoundError outside a source checkout.
    "dca_inverse_martingale",
    # The whole-share accumulation module (docs/whole_share_accumulation.md),
    # built for BYDDY. Imported unconditionally by near_close_dca
    # (_process_buy_candidate's whole-share dispatch); without it here,
    # import fails with ModuleNotFoundError outside a source checkout.
    "dca_whole_share_accumulator",
    # The 3D market-graph data layer and viewer emitter, imported by
    # scripts/generate_market_graph.py and by analysis/market-graph-3d/. Its browser
    # assets ship separately under [tool.setuptools.data-files] below -- both halves
    # are required, since the module resolves viz/ at call time and raises a
    # FileNotFoundError naming $DCA_VIZ_DIR when the assets are missing.
    "dca_market_graph",
    # Shared top-up outcome constructor used by both near_close_dca and
    # morning_dca. Without it here, those modules import cleanly from a
    # source checkout but raise ModuleNotFoundError from an installed wheel
    # (Copilot/Codex review: "Ship the extracted module in the wheel").
    "dca_common",
    # Weekly cross-account average-cost-basis snapshot builder/writer. No
    # in-repo caller by design (see "Three entry points" in CLAUDE.md) --
    # an external agent session fetches live Robinhood positions and calls
    # this module to aggregate and write them. Without it here it only
    # imports from a source checkout, not an installed wheel.
    "dca_average_cost_snapshot",
    # The live-DCA-side boundary module a second sizing suggester imports to
    # combine adjustment files (docs/repo_map.md, dca-sizing-signals/README.md).
    # No in-repo caller by design, which is exactly why nothing noticed it
    # shipped in no wheel (2026-09-07 diagnostic P:PACKAGING-02).
    "sizing_adjustment_reader",
    # Deliberately NOT listed: dca_console, dca_console_data, dca_console_jobs,
    # dca_console_octopus (and the from.py launcher) are the local developer
    # console and only ever run from a source checkout.
]
# scripts/run_classification.py is the run-classification contract used by both
# the live artifact writer (near_close_dca.build_run_artifacts) and readers
# (dca_risk, dca_reporting) -- it must ship with the installed package, not just
# exist in a checkout, or those imports fail at runtime (see scripts/__init__.py).
packages = ["scripts"]

# Ship the version-controlled config so an installed `run-dca` (outside a checkout) finds
# the live trading window instead of falling back to the hardcoded defaults. dca_config
# resolves these via sys.prefix/share/all-stock-dca/config.
[tool.setuptools.data-files]
"share/all-stock-dca/config" = [
    "config/budgets.json",
    "config/tickers.json",
    "config/sizing_ladder.json",
    "config/per_ticker_sizing.json",
    "config/backtest_sizing_ladder.json",
    "config/trading_window.json",
    "config/scheduled_tasks.json",
    "config/notifications.json",
    "config/reporting.json",
    "config/morning_dca.json",
    # Read by dca_runner's Gate 0; without it an installed wheel's
    # get_config_dir() resolution finds every other config file except this
    # one (Codex review: "Resolve runner configuration through the shared
    # loader").
    "config/market_calendar.json",
    "config/midday_dca.json",
    # Read by market_open_dca.load_market_open_config /
    # intraday_dca.load_intraday_config; without these an installed wheel's
    # get_config_dir() resolution falls back to defaults for both new live
    # streams (Codex review: "Ship all newly added stream modules and
    # configs").
    "config/market_open_dca.json",
    "config/intraday_dca.json",
    # Read by dca_config.load_inverse_martingale_config / load_ml_sizing_adjustment;
    # without these an installed wheel's get_config_dir() resolution falls back
    # to defaults (both modes fully off) for a checkout that intended them active.
    "config/inverse_martingale.json",
    "config/ml_sizing_adjustment.json",
    # Read by dca_config.load_near_close_overrides for the afternoon task; a
    # missing file yields {} silently, so an installed wheel ignored every
    # override a checkout honoured. tests/test_config_invariants.py now derives
    # this list from dca_config's own _read_json call sites (2026-09-07
    # diagnostic, P:PACKAGING-01).
    "config/near_close_dca.json",
]

# Browser assets for the 3D market graph, resolved at runtime by
# dca_market_graph.viewer_asset_dir() -- the same $ENV -> checkout -> sys.prefix -> cwd
# ladder dca_config.get_config_dir() uses. These are read as text and inlined into the
# emitted HTML; nothing here is ever imported by Python, so the stdlib-only runtime
# invariant is untouched (see viz/vendor/README.md for the vendoring rationale).
# Omitting them leaves the module importable from an installed wheel but unable to
# emit a page at all -- build_viewer_html() raises FileNotFoundError naming $DCA_VIZ_DIR.
"share/all-stock-dca/viz" = [
    "viz/market_graph.html.tmpl",
    "viz/market_graph.css",
    "viz/market_graph.js",
]
"share/all-stock-dca/viz/vendor" = [
    "viz/vendor/three.min.js",
    "viz/vendor/three.LICENSE",
]

# The combined OHLCV table is scripts/generate_market_graph.py's DEFAULT source, and
# dca_market_graph.default_combined_csv() looks for it here in an installed layout.
# Without this the documented default command works from a checkout and fails on every
# wheel install, which is the same trap the config data-files above exist to avoid.
"share/all-stock-dca/data" = [
    "historical_stock_data.csv",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
# Tests moved from flat repo-root files into tests/ (2026-08-23). Without
# rootdir explicitly on sys.path, pytest's default "prepend" import mode
# inserts each test file's own basedir (tests/, since it has no __init__.py)
# rather than the repo root -- breaking every `import near_close_dca`-style
# import of a root module, and every cross-test import (e.g.
# tests/test_market_open_dca.py's `from test_morning_dca import
# DecliningBarsProvider`). Listing both "." and "tests" here makes both kinds
# of import resolve regardless of whether the suite is invoked as `pytest` or
# `python -m pytest` (the latter already adds the cwd to sys.path via `-m`,
# but CI's `pytest --cov=. ...` does not).
pythonpath = [".", "tests"]
# production-safe-agent-loop/ and ticker-advisor/ are self-contained tools
# with their own deps (production-safe-agent-loop: anthropic, requests,
# beautifulsoup4; ticker-advisor: pandas, vectorbt, transformers/torch, ...)
# that aren't installed by requirements-dev.txt; run each suite from within
# its own directory instead (pip install -r <dir>/requirements.txt, then
# cd <dir> && python -m pytest tests/), so keep both out of the core
# "pytest" sweep the same way ruff already excludes them below.
# wondrous-octopus/ (pandas/numpy/scikit-learn/torch) follows the same rule.
addopts = "-q --ignore=production-safe-agent-loop --ignore=ticker-advisor --ignore=ml-forecaster --ignore=wondrous-octopus --ignore=dca-sizing-signals --ignore=ticker-market-breadth"

[tool.coverage.run]
# Measure the code that runs in production, not the suite that exercises it.
# Including test files inflates the figure by several points (they are executed
# almost end to end by construction) and makes the CI gate meaningless.
source = ["."]
omit = [
    "test_*.py",
    "*/tests/*",
    "conftest.py",
    # Research/analysis tooling: heavy third-party deps, no tests, and excluded
    # from the lint gate for the same reason (see [tool.ruff] extend-exclude).
    "trading-strategies/*",
    "analysis/*",
    ".github/*",
    "setup.py",
    # Self-contained heavy-dep subproject with its own pytest run, excluded
    # from the root "pytest --ignore" sweep above -- without this omit entry
    # its ~900 uncovered lines would count against the 90% gate for code the
    # root suite never executes (see ticker-advisor/README.md).
    "ticker-advisor/*",
    # Same reasoning as ticker-advisor/ above -- own pytest run, own heavy deps
    # (scikit-learn/pandas/numpy), excluded from the root sweep and gate.
    "ml-forecaster/*",
    # Same reasoning again -- own pytest run, own heavy deps (torch on top of
    # the ml-forecaster set), excluded from the root sweep and gate.
    "wondrous-octopus/*",
    "dca-sizing-signals/*",
    # Own pytest run, own yfinance/pandas dep -- see ticker-market-breadth/README.md.
    "ticker-market-breadth/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
# Third-party research tools and one-off analysis scripts are out of scope for the
# core lint gate (they carry their own heavy deps and looser conventions). The
# ".github" tree is CI config plus tooling scripts injected into the CI workspace
# by external review integrations (not tracked core source), so it is excluded
# too -- the CI lint step is scoped to "core modules", matching this exclude.
# production-safe-agent-loop/, ticker-advisor/, ml-forecaster/, and wondrous-octopus/ are
# likewise self-contained tools with their own requirements.txt and test suite, each run
# independently of the core gate (own ruff invocation in .github/workflows/ci.yml).
#
# claude/ is deliberately NOT excluded here: it holds the tracked morning/midday signal
# harnesses invoked to generate live-session candidate output, so it must stay covered by
# the ordinary `ruff check .` CI lint gate. self-heal must not rewrite that tree, but that
# requirement is enforced on the repair commands themselves (scripts/self_heal.py's
# `--extend-exclude claude`), not by disabling lint for it globally (Codex review, PR #507).
extend-exclude = [
    "trading-strategies",
    "analysis",
    ".github",
    "production-safe-agent-loop",
    "ticker-advisor",
    "ml-forecaster",
    "wondrous-octopus",
    "dca-sizing-signals",
    "ticker-market-breadth",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pyright]
extraPaths = [
    "scripts",
    "ml-forecaster",
    "ticker-advisor",
    "production-safe-agent-loop",
    "wondrous-octopus",
]
typeCheckingMode = "basic"
reportGeneralTypeIssues = false

