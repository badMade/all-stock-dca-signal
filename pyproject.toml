[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-stock-dca"
version = "0.1.0"
description = "Near-close graded dollar-cost-averaging strategy: signal logic, budgets, safeguards, reporting, and broker-agnostic adapters."
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# The core strategy, config loader, live adapters, reporting, and CLI are
# standard-library only — no runtime third-party dependencies. Optional extras
# (below) cover the separate trading-strategies research tools.
dependencies = []

[project.optional-dependencies]
# Test/lint tooling. Kept in sync with requirements-dev.txt, which pins exact
# versions for CI; this extra backs the documented `pip install -e '.[dev]'`
# path. Both must install the same tools or the two paths run different suites:
# without jsonschema/referencing the schema tests importorskip themselves into a
# silent pass, and without pytest-cov the documented coverage command cannot run
# at all (Codex review, PR #219).
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "jsonschema>=4.25",
    "referencing>=0.36",
    "pytest-cov>=7.0",
    # scripts/workflow_policy.py imports yaml; without it here, `pip install
    # -e '.[dev]'` collects fine on an environment where jsonschema/referencing
    # happen to pull PyYAML in transitively and fails collection everywhere
    # else, since it isn't a documented dependency of either (Codex review,
    # PR #219: "Include PyYAML in the dev extra").
    "pyyaml>=6.0",
]
# Heavy, undeclared-elsewhere deps used only by the trading-strategies/ research
# tools (backtester, sentiment monitor). Not needed to run the DCA strategy.
strategies = [
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "jinja2",
    "yfinance",
    "vectorbt",
    "alpaca-py",
    "newsapi-python",
    "transformers",
    "torch",
]

[project.scripts]
run-dca = "run_dca:main"
run-dca-risk = "dca_risk:main"

[tool.setuptools]
# Flat single-file modules rather than a package tree; list them explicitly.
py-modules = [
    "near_close_dca",
    "morning_dca",
    "midday_dca",
    "dca_alerts",
    "dca_config",
    "dca_fileio",
    # Imported by morning/midday/alerts and by scripts/*, so it must ship with
    # the wheel or those imports fail outside a checkout.
    "dca_paths",
    "dca_risk",
    "dca_live_adapters",
    "dca_reporting",
    "dca_cost_tracker",
    "dca_notion_sync",
    "dca_weekly_dashboard",
    "run_dca",
]
# scripts/run_classification.py is the run-classification contract used by both
# the live artifact writer (near_close_dca.build_run_artifacts) and readers
# (dca_risk, dca_reporting) -- it must ship with the installed package, not just
# exist in a checkout, or those imports fail at runtime (see scripts/__init__.py).
packages = ["scripts"]

# Ship the version-controlled config so an installed `run-dca` (outside a checkout) finds
# the live trading window instead of falling back to the hardcoded defaults. dca_config
# resolves these via sys.prefix/share/all-stock-dca/config.
[tool.setuptools.data-files]
"share/all-stock-dca/config" = [
    "config/budgets.json",
    "config/tickers.json",
    "config/sizing_ladder.json",
    "config/backtest_sizing_ladder.json",
    "config/trading_window.json",
    "config/scheduled_tasks.json",
    "config/notifications.json",
    "config/reporting.json",
    "config/morning_dca.json",
    "config/midday_dca.json",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
# production-safe-agent-loop/ is a self-contained tool with its own deps
# (anthropic, requests, beautifulsoup4) that aren't installed by
# requirements-dev.txt; run its suite from within that directory instead
# (pip install -r production-safe-agent-loop/requirements.txt, then
# cd production-safe-agent-loop && python -m pytest tests/), so keep it
# out of the core "pytest" sweep the same way ruff already excludes it
# below.
addopts = "-q --ignore=production-safe-agent-loop"

[tool.coverage.run]
# Measure the code that runs in production, not the suite that exercises it.
# Including test files inflates the figure by several points (they are executed
# almost end to end by construction) and makes the CI gate meaningless.
source = ["."]
omit = [
    "test_*.py",
    "*/tests/*",
    "conftest.py",
    # Research/analysis tooling: heavy third-party deps, no tests, and excluded
    # from the lint gate for the same reason (see [tool.ruff] extend-exclude).
    "trading-strategies/*",
    "analysis/*",
    ".github/*",
    "setup.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
# Third-party research tools and one-off analysis scripts are out of scope for the
# core lint gate (they carry their own heavy deps and looser conventions). The
# ".github" tree is CI config plus tooling scripts injected into the CI workspace
# by external review integrations (not tracked core source), so it is excluded
# too -- the CI lint step is scoped to "core modules", matching this exclude.
# production-safe-agent-loop/ is likewise a self-contained tool with its own
# requirements.txt and test suite, run independently of the core gate.
extend-exclude = ["trading-strategies", "analysis", ".github", "production-safe-agent-loop"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
