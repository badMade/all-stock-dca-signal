[tool.pytest.ini_options]
# Self-contained pytest config for ticker-market-breadth, mirroring
# ticker-advisor/pyproject.toml. Without this file pytest walks up to the
# repo-root pyproject.toml, which sets rootdir to the repo root and applies
# addopts/testpaths scoped to the core, stdlib-only DCA suite -- not this
# small yfinance-dependent subproject.
testpaths = ["tests"]
python_files = ["test_*.py"]
